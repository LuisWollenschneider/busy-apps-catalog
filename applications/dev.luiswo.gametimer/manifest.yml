short_description: "Animated turn timer for board games: START sets the clock going; at zero it strobes red and sounds an alarm."
description: "@CATALOG.md"
changelog: "First release: an animated turn timer styled like the BUSY Bar's status themes. START gives a fresh turn; OK pauses; blue, amber and red as time runs out; a red strobe and an alarm at zero; the time per turn set with the wheel and remembered; the alarm and counting past zero in the settings."
